name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Synchronize distribution sources
        run: bash packages/sync-vendor.sh
      - name: Verify generated files are committed
        run: git diff --exit-code
      - name: Test installable packages
        run: node packages/test-tarballs.mjs
      - name: Build DSH release tarball
        run: |
          mkdir -p dist
          npm pack ./packages/dsh-cad-studio --offline --ignore-scripts --pack-destination dist
          mv dist/dsh-cad-studio-*.tgz dist/dsh-cad-studio.tgz
          sha256sum dist/dsh-cad-studio.tgz > dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-cad-studio
          path: |
            dist/dsh-cad-studio.tgz
            dist/SHA256SUMS
      - name: Attach assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/dsh-cad-studio.tgz
            dist/SHA256SUMS
